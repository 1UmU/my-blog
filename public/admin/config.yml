# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: 1UmU/my-blog
  branch: master
  base_url: https://sveltia-cms-auth.2715337042.workers.dev

site_url: https://blog.voqz.de
display_url: https://blog.voqz.de
app_title: UmU 内容管理
logo:
  src: /assets/images/firefly.png
  show_in_header: true
publish_mode: simple

output:
  omit_empty_optional_fields: true

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

media_folder: public/assets/images/posts
public_folder: /assets/images/posts

media_libraries:
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1920

editor:
  preview: false

asset_collections:
  - name: post_images
    label: 文章图片
    icon: photo_library
    media_folder: public/assets/images/posts
    public_folder: /assets/images/posts
  - name: site_images
    label: 站点图片
    icon: imagesmode
    media_folder: public/assets/images/site
    public_folder: /assets/images/site
  - name: music_files
    label: 音乐文件
    icon: audio_file
    media_folder: public/assets/music
    public_folder: /assets/music

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    icon: article
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{published}}"
    sortable_fields: [published, updated, title]
    view_filters:
      - label: 草稿
        field: draft
        pattern: true
      - label: 已发布
        field: draft
        pattern: false
      - label: 置顶
        field: pinned
        pattern: true
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: published
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - label: 更新日期
        name: updated
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
      - label: 摘要
        name: description
        widget: text
        required: false
      - label: 封面
        name: image
        widget: image
        choose_url: true
        required: false
        hint: 点击选择或上传图片；填写 api 可使用随机封面
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 分类
        name: category
        widget: string
        required: false
      - label: 语言
        name: lang
        widget: select
        required: false
        options:
          - { label: 简体中文, value: zh-CN }
          - { label: 繁体中文, value: zh-TW }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
      - label: 草稿
        name: draft
        widget: boolean
        default: false
      - label: 置顶
        name: pinned
        widget: boolean
        default: false
        required: false
      - label: 开启评论
        name: comment
        widget: boolean
        default: true
        required: false
      - label: 作者
        name: author
        widget: string
        required: false
      - label: 原文链接
        name: sourceLink
        widget: string
        required: false
      - label: 许可名称
        name: licenseName
        widget: string
        required: false
      - label: 许可链接
        name: licenseUrl
        widget: string
        required: false
      - label: 正文
        name: body
        widget: markdown

  - name: music
    label: 音乐管理
    icon: library_music
    files:
      - name: player
        label: 播放器与歌单
        icon: queue_music
        file: src/config/musicData.json
        format: json
        fields:
          - label: 启用音乐播放器
            name: enable
            widget: boolean
            default: true
          - label: 自动播放
            name: autoplay
            widget: boolean
            default: false
            hint: 大多数浏览器会在用户首次操作页面前阻止自动播放
          - label: 循环方式
            name: loop
            widget: select
            default: all
            options:
              - { label: 列表循环, value: all }
              - { label: 单曲循环, value: one }
              - { label: 播放一次, value: none }
          - label: 播放顺序
            name: order
            widget: select
            default: list
            options:
              - { label: 顺序播放, value: list }
              - { label: 随机播放, value: random }
          - label: 默认音量
            name: volume
            widget: number
            value_type: float
            min: 0
            max: 1
            step: 0.1
            default: 0.7
            hint: 0 为静音，1 为最大音量
          - label: 默认隐藏歌词
            name: lrcHidden
            widget: boolean
            default: true
          - label: 默认折叠播放列表
            name: listFolded
            widget: boolean
            default: false
          - label: 歌曲列表
            label_singular: 歌曲
            name: playlist
            widget: list
            min: 1
            summary: "{{fields.name}} · {{fields.artist}}"
            fields:
              - label: 歌曲名称
                name: name
                widget: string
              - label: 歌手
                name: artist
                widget: string
              - label: 音频文件
                name: url
                widget: file
                choose_url: true
                accept: "audio/*,.mp3,.ogg,.wav,.m4a,.aac,.flac"
                media_folder: public/assets/music/tracks
                public_folder: /assets/music/tracks
                hint: 推荐 MP3；可上传文件，也可填写可公开访问的音频 URL
              - label: 封面
                name: cover
                widget: image
                choose_url: true
                required: false
                media_folder: public/assets/music/cover
                public_folder: /assets/music/cover
              - label: LRC 歌词
                name: lrc
                widget: text
                required: false
                hint: 可粘贴带时间标记的 LRC 歌词内容

  - name: settings
    label: 站点设置
    icon: settings
    files:
      - name: appearance
        label: 站点外观
        icon: palette
        file: src/config/siteAppearance.json
        format: json
        media_folder: /public/assets/images/site
        public_folder: /assets/images/site
        fields:
          - label: 个人头像
            name: avatar
            widget: image
            choose_url: true
            hint: 建议使用正方形图片
          - label: 导航栏 Logo
            name: navbarLogo
            widget: image
            choose_url: true
            hint: 建议使用透明背景的正方形图片
          - label: 桌面背景图
            name: desktopWallpaper
            widget: image
            choose_url: true
            hint: 建议使用横向大图
          - label: 手机背景图
            name: mobileWallpaper
            widget: image
            choose_url: true
            hint: 建议使用竖向大图
          - label: 默认文章封面
            name: defaultPostCover
            widget: image
            choose_url: true
            hint: 随机封面加载失败时使用

  - name: pages
    label: 独立页面
    icon: web
    files:
      - name: about
        label: 关于
        file: src/content/spec/about.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 摘要, name: description, widget: text, required: false }
          - { label: 封面, name: image, widget: image, required: false }
          - { label: 正文, name: body, widget: markdown }
      - name: friends
        label: 友情链接
        file: src/content/spec/friends.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 摘要, name: description, widget: text, required: false }
          - { label: 正文, name: body, widget: markdown }
      - name: guestbook
        label: 留言板
        file: src/content/spec/guestbook.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 摘要, name: description, widget: text, required: false }
          - { label: 正文, name: body, widget: markdown }
